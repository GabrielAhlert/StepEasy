name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Sem `RUSTFLAGS: -D warnings` de propósito: isso valeria também para as
  # dependências, e um aviso novo numa crate de terceiros derrubaria o CI sem
  # que houvesse nada a corrigir aqui. O rigor fica no clippy, abaixo, que só
  # olha o código do projeto.

jobs:
  verificar:
    name: ${{ matrix.nome }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Uma plataforma quebrada não deve esconder o resultado da outra.
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            nome: Windows
          - os: ubuntu-latest
            nome: Linux

    steps:
      - uses: actions/checkout@v4

      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      # O aplicativo é Windows-first, mas o workspace precisa continuar
      # compilando no Linux — é o que garante que o `stub` de plataforma não
      # apodreça antes do suporte chegar de verdade.
      - name: Dependências de sistema (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libx11-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxi-dev \
            libgl1-mesa-dev \
            libxcb1-dev \
            libxcb-randr0-dev \
            libdbus-1-dev \
            libpipewire-0.3-dev \
            libclang-dev \
            pkg-config

      # Formatação é a mesma nos dois sistemas; conferir uma vez basta.
      - name: Formatação
        if: runner.os == 'Linux'
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Testes
        run: cargo test --workspace
