name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Sem `RUSTFLAGS: -D warnings` de propósito: isso valeria também para as
  # dependências, e um aviso novo numa crate de terceiros derrubaria o CI sem
  # que houvesse nada a corrigir aqui. O rigor fica no clippy, abaixo, que só
  # olha o código do projeto.

# Um push novo cancela a verificacao do anterior no mesmo ramo. Sem isto, uma
# sequencia de commits enfileira execucoes inteiras que ninguem vai ler, e a
# fila esconde o resultado que interessa.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: ${{ matrix.nome }}
    runs-on: ${{ matrix.os }}
    # O limite existe por causa do apt: um espelho lento ja segurou um job por
    # meia hora antes de alguem cancelar na mao. Melhor falhar em 25 minutos.
    timeout-minutes: 25
    strategy:
      # Uma plataforma quebrada não deve esconder o resultado da outra.
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            nome: Windows
          - os: ubuntu-latest
            nome: Linux

    steps:
      - uses: actions/checkout@v4

      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      # O aplicativo é Windows-first, mas o workspace precisa continuar
      # compilando no Linux — é o que garante que o `stub` de plataforma não
      # apodreça antes do suporte chegar de verdade.
      - name: Dependências de sistema (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 10
        uses: ./.github/actions/deps-linux

      # Formatação é a mesma nos dois sistemas; conferir uma vez basta.
      - name: Formatação
        if: runner.os == 'Linux'
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Testes
        run: cargo test --workspace
