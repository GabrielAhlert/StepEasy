name: Release

# Dispara ao empurrar uma tag de versão:
#
#     git tag v0.1.0 && git push origin v0.1.0
#
# Também dá para rodar à mão pela aba Actions, informando a tag.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Tag a publicar (ex.: v0.1.0)
        required: true

env:
  CARGO_TERM_COLOR: always

jobs:
  compilar:
    name: ${{ matrix.nome }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            nome: Windows
            pacote: stepeasy-windows-x86_64
            binario: stepeasy.exe
          - os: ubuntu-latest
            nome: Linux
            pacote: stepeasy-linux-x86_64
            binario: stepeasy

    steps:
      - uses: actions/checkout@v4

      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Dependências de sistema (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libx11-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxi-dev \
            libgl1-mesa-dev \
            libxcb1-dev \
            libxcb-randr0-dev \
            libdbus-1-dev \
            libpipewire-0.3-dev \
            libclang-dev \
            pkg-config

      - name: Compilar
        run: cargo build --release -p stepeasy

      - name: Montar o pacote
        shell: bash
        run: |
          mkdir -p pacote
          cp "target/release/${{ matrix.binario }}" pacote/
          cp README.md LICENSE pacote/

      - name: Compactar (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path pacote\* -DestinationPath ${{ matrix.pacote }}.zip

      - name: Compactar (Linux)
        if: runner.os == 'Linux'
        run: tar -czf ${{ matrix.pacote }}.tar.gz -C pacote .

      - name: Guardar o artefato
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.pacote }}
          path: |
            *.zip
            *.tar.gz
          if-no-files-found: error

  publicar:
    name: Publicar release
    needs: compilar
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artefatos
          merge-multiple: true

      - name: Criar a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          draft: true
          generate_release_notes: true
          files: artefatos/*
