name: Release

# Dispara ao empurrar uma tag de versão:
#
#     git tag v0.1.0 && git push origin v0.1.0
#
# Também dá para rodar à mão pela aba Actions, informando a tag.
#
# Só publica binário de Windows: é o único sistema onde a captura funciona de
# verdade. O Linux continua sendo compilado no CI — o que garante que o `stub`
# de plataforma não apodreça — mas um pacote que abre a janela e não grava nada
# seria promessa falsa. Quando o suporte chegar, basta devolver o Linux à
# matriz abaixo e a etapa de dependências (`./.github/actions/deps-linux`).
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        # Entre aspas: um ": " solto dentro do texto faria o YAML virar mapa.
        description: "Tag a publicar, por exemplo v0.1.0"
        required: true

env:
  CARGO_TERM_COLOR: always

jobs:
  compilar:
    name: ${{ matrix.nome }}
    runs-on: ${{ matrix.os }}
    env:
      # No nível do job de propósito: o contexto `secrets` não está disponível
      # no `if` de um passo, mas uma variável de ambiente do job está. É assim
      # que os passos de assinatura conseguem se desligar sozinhos enquanto
      # não houver certificado.
      CERT_THUMBPRINT: ${{ secrets.WINDOWS_CERT_THUMBPRINT }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            nome: Windows
            pacote: stepeasy-windows-x86_64
            binario: stepeasy.exe

    steps:
      - uses: actions/checkout@v4

      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Compilar
        run: cargo build --release -p stepeasy

      # Da tag saem duas formas da versão: a de exibição (que pode ter sufixo,
      # como 0.2.0-rc1) e a numérica, exigida pelo campo de versão do .exe.
      - name: Definir a versão
        id: versao
        shell: bash
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSAO="${TAG#v}"
          NUMERICA="$(echo "$VERSAO" | grep -oE '^[0-9]+(\.[0-9]+){0,3}')"
          NUMERICA="${NUMERICA:-0.0.0}"
          echo "versao=$VERSAO" >> "$GITHUB_OUTPUT"
          echo "numerica=$NUMERICA" >> "$GITHUB_OUTPUT"
          echo "Versão $VERSAO (numérica $NUMERICA)"

      # A assinatura fica aqui, entre compilar e empacotar, para o instalador
      # já embrulhar um executável assinado. Só roda quando os segredos
      # existirem — sem certificado, o release continua saindo normalmente.
      - name: Assinar o executável
        if: env.CERT_THUMBPRINT != ''
        run: |
          & "${env:ProgramFiles(x86)}\Windows Kits\10\bin\x64\signtool.exe" sign `
            /sha1 $env:CERT_THUMBPRINT `
            /fd SHA256 `
            /tr http://timestamp.digicert.com /td SHA256 `
            target\release\${{ matrix.binario }}

      - name: Montar o pacote portátil
        shell: bash
        run: |
          mkdir -p pacote
          cp "target/release/${{ matrix.binario }}" pacote/
          cp README.md LICENSE pacote/

      - name: Compactar o portátil
        run: Compress-Archive -Path pacote\* -DestinationPath ${{ matrix.pacote }}.zip

      # O Inno Setup vem pré-instalado na imagem do runner; o fallback existe
      # para o dia em que a imagem mudar e o release não quebrar por isso.
      - name: Localizar o Inno Setup
        id: inno
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            Write-Host "Inno Setup não encontrado na imagem; instalando."
            choco install innosetup --no-progress -y
          }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe não encontrado em $iscc" }
          "iscc=$iscc" >> $env:GITHUB_OUTPUT

      - name: Gerar o instalador
        run: |
          & "${{ steps.inno.outputs.iscc }}" `
            /DMyAppVersion=${{ steps.versao.outputs.versao }} `
            /DMyAppVersionNumeric=${{ steps.versao.outputs.numerica }} `
            installer\stepeasy.iss

      - name: Assinar o instalador
        if: env.CERT_THUMBPRINT != ''
        run: |
          Get-ChildItem dist\*.exe | ForEach-Object {
            & "${env:ProgramFiles(x86)}\Windows Kits\10\bin\x64\signtool.exe" sign `
              /sha1 $env:CERT_THUMBPRINT `
              /fd SHA256 `
              /tr http://timestamp.digicert.com /td SHA256 `
              $_.FullName
          }

      # Tudo numa pasta só antes de subir. Com dois caminhos de origem, o
      # artefato preserva a estrutura a partir do ancestral comum e o
      # instalador chegaria em `artefatos/dist/` — onde o `files: artefatos/*`
      # da publicação casaria com a pasta e ignoraria o arquivo dentro dela.
      - name: Reunir os artefatos
        shell: bash
        run: |
          mkdir -p artefatos
          mv *.zip artefatos/
          mv dist/*.exe artefatos/
          ls -la artefatos

      - name: Guardar os artefatos
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.pacote }}
          path: artefatos/*
          if-no-files-found: error

  publicar:
    name: Publicar release
    needs: compilar
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artefatos
          merge-multiple: true

      # Rascunho de propósito: publicar é decisão de quem mantém, não do CI.
      - name: Criar a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          draft: true
          generate_release_notes: true
          files: artefatos/*
