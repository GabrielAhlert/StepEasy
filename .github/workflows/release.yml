name: Release

# Dispara ao empurrar uma tag de versão:
#
#     git tag v0.1.0 && git push origin v0.1.0
#
# Também dá para rodar à mão pela aba Actions, informando a tag.
#
# Só publica binário de Windows: é o único sistema onde a captura funciona de
# verdade. O Linux continua sendo compilado no CI — o que garante que o `stub`
# de plataforma não apodreça — mas um pacote que abre a janela e não grava nada
# seria promessa falsa. Quando o suporte chegar, basta devolver o Linux à
# matriz abaixo e a etapa de dependências (`./.github/actions/deps-linux`).
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        # Entre aspas: um ": " solto dentro do texto faria o YAML virar mapa.
        description: "Tag a publicar, por exemplo v0.1.0"
        required: true

env:
  CARGO_TERM_COLOR: always

jobs:
  compilar:
    name: ${{ matrix.nome }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            nome: Windows
            pacote: stepeasy-windows-x86_64
            binario: stepeasy.exe

    steps:
      - uses: actions/checkout@v4

      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Compilar
        run: cargo build --release -p stepeasy

      - name: Montar o pacote
        shell: bash
        run: |
          mkdir -p pacote
          cp "target/release/${{ matrix.binario }}" pacote/
          cp README.md LICENSE pacote/

      - name: Compactar
        run: Compress-Archive -Path pacote\* -DestinationPath ${{ matrix.pacote }}.zip

      - name: Guardar o artefato
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.pacote }}
          path: '*.zip'
          if-no-files-found: error

  publicar:
    name: Publicar release
    needs: compilar
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artefatos
          merge-multiple: true

      # Rascunho de propósito: publicar é decisão de quem mantém, não do CI.
      - name: Criar a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          draft: true
          generate_release_notes: true
          files: artefatos/*
