  sair_salvar: Salvar e sair
  sair_sem_salvar: Sair sem salvar
  recuperar_titulo: Encontramos uma gravação não salva
  recuperar_texto: >-
    O StepEasy guarda um rascunho enquanto você grava e edita. O da sessão
    anterior não chegou a ser salvo em arquivo.
  recuperar: Recuperar
  descartar: Descartar
  depois: Decidir depois

