_version: 1

# Idioma de referência do StepEasy. Para traduzir, copie locales/en.yml e
# traduza os valores — veja TRANSLATING.md.

idioma:
  nome: Português (Brasil)

comum:
  salvar: Salvar
  abrir: Abrir
  exportar: Exportar
  cancelar: Cancelar
  excluir: Excluir
  duplicar: Duplicar
  remover: remover
  dispensar: Dispensar
  gravar: Gravar
  editar: Editar
  passos: "%{n} passo(s)"
  nao_salvo: não salvo

gravador:
  titulo: Gravar um passo a passo
  subtitulo: >-
    Cada clique e cada trecho digitado vira um passo com captura de tela.
    Você revisa e reorganiza tudo antes de exportar.
  escopo_titulo: O que capturar
  minimizar: Minimizar o StepEasy durante a gravação
  iniciar: Iniciar gravação
  continuar: "Continuar a gravação aberta (%{passos} passos)"
  continuar_dica: Os passos novos entram no fim da gravação, sem apagar os que já existem
  atalhos: "Durante a gravação: %{parar} encerra, %{pausar} pausa e retoma"
  atalhos_gravando: "de qualquer lugar: %{parar} encerra, %{pausar} pausa e retoma"
  gravando: ● Gravando
  pausado: ❙❙ Pausado
  capturados: "%{n} passo(s) capturado(s)"
  acrescentados: "%{n} passo(s) acrescentado(s)"
  encerrar: Encerrar gravação
  pausar: Pausar
  retomar: Retomar
  pausa_aviso: Nada está sendo capturado enquanto a pausa durar.
  sem_suporte: >-
    A captura de entrada ainda não está disponível neste sistema operacional.
    Você pode abrir e editar gravações existentes.
  sem_telas: Nenhuma tela foi detectada.

escopo:
  tela_do_cursor: Tela sob o cursor
  tela_especifica: Tela específica
  todas_as_telas: Todas as telas
  janela_ativa: Janela ativa
  regiao: Região
  monitor_principal: " (principal)"
  ajuda:
    tela_do_cursor: >-
      Cada captura pega a tela onde o clique aconteceu. É o modo mais seguro
      quando você usa mais de um monitor.
    tela_especifica: Sempre a mesma tela, mesmo que o clique aconteça em outra.
    todas_as_telas: Todas as telas lado a lado numa imagem só. Gera arquivos grandes.
    janela_ativa: >-
      Só a janela em foco entra na imagem, sem área de trabalho nem barra de
      tarefas. Cliques em menus suspensos caem para a tela inteira.
    regiao: Sempre a mesma região da tela.

