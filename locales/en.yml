    item_menu: menu item
    opcao: radio button
    barra_rolagem: scroll bar
    conjunto_guias: tab strip
    guia: tab
    texto: text
    barra_ferramentas: toolbar
    arvore: tree
    item_arvore: tree item
    janela: window
    item: item
    tabela: table
    documento: document
    botao_divisao: split button
