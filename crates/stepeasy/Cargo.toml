[package]
name = "stepeasy"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Gravador de passo a passo local, open source e multiplataforma"

[[bin]]
name = "stepeasy"
path = "src/main.rs"

[dependencies]
stepeasy-ui.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

# Só para o exemplo que rasteriza o logo. Os ícones gerados ficam versionados,
# então quem só compila o aplicativo não paga por estas dependências.
[dev-dependencies]
resvg = "0.45"
image.workspace = true

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
